services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    volumes:
      - sqlserver-data:/var/opt/mssql
  
  seq:
    image: datalust/seq:latest
    volumes:
      - seq-data:/data
  
  rabbitmq:
    image: rabbitmq:4-management
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
  
  distributedcache:
    image: redis

volumes:
  sqlserver-data:
  seq-data:
  rabbitmq-data: